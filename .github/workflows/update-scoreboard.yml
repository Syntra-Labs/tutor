name: Update Autolab Scoreboard & GitHub Pages (Trusted)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'submissions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoreboard-updater
  cancel-in-progress: false

jobs:
  merge-scoreboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge into Autolab Leaderboard & Export Static Catalog
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            USERS=$(echo "$CHANGED" | grep '^submissions/' | cut -d/ -f2 | sort -u || true)
            for U in $USERS; do
              python3 -m tutor.cli ci-grade-pr --user "$U" --commit-sha "${{ github.sha }}" --output /tmp/direct_entries_${U}.json $CHANGED || true
              if [ -f /tmp/direct_entries_${U}.json ]; then
                python3 -m tutor.cli ci-merge-scoreboard --input /tmp/direct_entries_${U}.json
              fi
            done
          fi
          python3 -m tutor.cli export-pages

      - name: Commit updated scoreboard and static data chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/leaderboard.json docs/data/catalog.json docs/data/manifest.json docs/data/problems/
          git diff --staged --quiet || (git commit -m "chore(scoreboard): update Autolab standings & catalog data [skip ci]" && git push)
