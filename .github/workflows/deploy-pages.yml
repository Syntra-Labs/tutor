name: Deploy GitHub Pages (Main & Dev Preview)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Site Staging Directory
        run: |
          mkdir -p _site/dev
          
          # 1. Populate main production root
          git checkout origin/main
          python3 -m tutor.cli export-pages
          cp -r docs/* _site/
          
          # 2. Populate dev preview at /dev/
          if git rev-parse --verify origin/dev >/dev/null 2>&1; then
            git checkout origin/dev
            python3 -m tutor.cli export-pages
            cp -r docs/* _site/dev/
          fi

          echo "=== Root Staging ==="
          ls -la _site
          echo "=== Dev Staging ==="
          ls -la _site/dev

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
