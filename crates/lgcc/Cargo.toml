[package]
name = "lgcc"
version = "1.0.0"
edition = "2021"
description = "Native Logical Compiler, Clean-Room Contract Slicer & Task Graph Spec Engine"
license = "MIT"

[[bin]]
name = "lgcc"
path = "src/bin/main.rs"

[lib]
name = "lgcc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
walkdir = "2"
